<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b14">
  <meta name="referrer" content="no-referrer">
  <title>Stremio Controle</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/maskable-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>

  <header class="top">
    <img src="icons/icon-192.png" alt="" class="logo">
    <div class="brand-box">
      <span class="brand">Stremio Controle <span class="ver" id="pcVer" hidden></span></span>
      <button class="profile" id="profile">…</button>
    </div>
    <button class="conn" id="conn" data-state="off"><span class="dot"></span><span id="connText"></span></button>
  </header>

  <div class="notice" id="updNotice" role="status" hidden>
    <p data-i18n="updatedText"></p>
  </div>

  <!-- Sem pareamento -->
  <section class="pair" id="pairView" hidden>
    <h1 data-i18n="pairTitle"></h1>
    <p data-i18n="pairText"></p>
    <a class="btn scan-btn" href="https://brennergpcosta.github.io/Stremio-Controller/#scan" data-i18n="scanQr"></a>
  </section>

  <!-- A chave mudou no PC ("Trocar QR code") -->
  <section class="pair" id="deniedView" hidden>
    <h1 data-i18n="deniedTitle"></h1>
    <p data-i18n="deniedText"></p>
    <a class="btn scan-btn" href="https://brennergpcosta.github.io/Stremio-Controller/#scan" data-i18n="scanQr"></a>
  </section>

  <!-- Sem resposta do PC -->
  <div class="notice" id="lostView" role="status" hidden>
    <p><strong data-i18n="lostTitle"></strong></p>
    <p data-i18n="lostText"></p>
    <a class="btn scan-btn" href="https://brennergpcosta.github.io/Stremio-Controller/#scan" data-i18n="scanQr"></a>
  </div>

  <!-- Stremio fechado no PC -->
  <section class="closed" id="closedView" hidden>
    <h2 data-i18n="closedTitle"></h2>
    <p data-i18n="closedText"></p>
    <div class="closed-btns" id="closedBtns"></div>
  </section>

  <main id="mainView" hidden>
    <!-- Mini player: aparece nas listas quando algo toca -->
    <button class="mini" id="mini" hidden>
      <span class="mini-icon" id="miniIcon"></span>
      <span class="mini-text"><span class="mini-title" id="miniTitle"></span><span class="mini-time" id="miniTime"></span></span>
      <span class="mini-go"><span data-i18n="STREMIO_TV_REMOTE"></span> ›</span>
    </button>

    <section class="pane" id="pane-home"><div id="homeRows"></div></section>
    <!-- "Ver tudo" de uma seção da Home -->
    <section class="pane" id="pane-all" hidden>
      <div class="all-head">
        <button class="all-back" id="allBack" aria-label="Voltar">‹</button>
        <div class="all-title" id="allTitle"></div>
      </div>
      <div class="grid" id="grid-all"></div>
      <div class="all-more" id="allMore"></div>
    </section>
    <section class="pane" id="pane-lib" hidden><div class="grid" id="grid-lib"></div></section>
    <section class="pane" id="pane-search" hidden>
      <form class="search" id="searchForm">
        <input type="search" id="searchInput" data-i18n-ph="SEARCH" enterkeyhint="search" autocomplete="off">
      </form>
      <div class="grid" id="grid-search"></div>
    </section>

    <section class="pane ctl" id="pane-ctl" hidden>
      <img class="ctl-poster" id="ctlPoster" alt="">
      <div class="ctl-title" id="ctlTitle"></div>
      <div class="ctl-sub" id="ctlSub"></div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posição">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="ctl-btn" data-cmd="back" aria-label="Voltar 10 segundos"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700">10</text></svg></button>
        <button class="ctl-btn big" id="btnPlay" data-cmd="toggle" aria-label="Tocar ou pausar">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ctl-btn" data-cmd="fwd" aria-label="Avançar 10 segundos"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.2" text-anchor="middle" font-size="6.5" font-weight="700">10</text></svg></button>
      </div>
      <div class="vol">
        <svg viewBox="0 0 24 24" class="vol-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <input type="range" id="vol" min="0" max="200" step="5" value="100" aria-label="Volume">
        <span class="vol-num" id="volNum">100</span>
        <button class="ctl-btn small" id="btnFs" aria-label="Tela cheia no PC">
          <svg viewBox="0 0 24 24" class="i-fs"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          <svg viewBox="0 0 24 24" class="i-fs-exit"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
        </button>
      </div>
      <!-- Opções do player do Stremio: as mesmas dos menus dele -->
      <div class="popts" id="popts" hidden>
        <div class="popt-btns">
          <button class="popt" id="btnSubs"><svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM5 12h3v2H5v-2zm9 6H5v-2h9v2zm5 0h-3v-2h3v2zm0-4h-9v-2h9v2z"/></svg><span class="popt-l" data-i18n="SUBTITLES"></span><span class="popt-v" id="subsVal"></span></button>
          <button class="popt" id="btnAudio"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span class="popt-l" data-i18n="AUDIO"></span><span class="popt-v" id="audioVal"></span></button>
          <button class="popt" id="btnScale"><svg viewBox="0 0 24 24"><path d="M19 12h-2v3h-3v2h5v-5zM7 9h3V7H5v5h2V9zm14-6H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18v14z"/></svg><span class="popt-l" id="scaleVal"></span></button>
          <button class="popt" id="btnNext" hidden><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg><span class="popt-l" data-i18n="PLAYER_NEXT_VIDEO"></span><span class="popt-v" id="nextVal"></span></button>
        </div>
        <!-- Velocidade como no player do Stremio: valor, slider (0,1x a 4x) e atalhos -->
        <div class="speed-box">
          <div class="popt-title" data-i18n="PLAYBACK_SPEED"></div>
          <div class="speed-val" id="speedVal">1x</div>
          <input type="range" id="speedSlider" min="0.1" max="4" step="0.05" value="1" aria-label="Playback speed">
          <div class="speeds" id="speeds"></div>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-i18n="Board"></span></button>
    <button data-tab="lib"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span data-i18n="Library"></span></button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span data-i18n="SEARCH"></span></button>
    <button data-tab="ctl"><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12zM10 7.5v7l5.5-3.5z"/></svg><span data-i18n="STREMIO_TV_REMOTE"></span></button>
  </nav>

  <!-- Detalhe: temporadas, episódios e fontes -->
  <dialog class="sheet" id="sheet" aria-label="Detalhes">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <img id="sheetPoster" alt="">
      <div>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <!-- Contas do Stremio salvas no PC -->
  <dialog class="sheet" id="accSheet" aria-label="Contas">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 class="opt-h" data-i18n="accounts"></h2>
    <div class="sheet-body" id="accBody"></div>
    <button class="btn acc-add" id="accAdd" data-i18n="accAdd"></button>
    <p class="acc-hint" data-i18n="accHint"></p>
  </dialog>

  <!-- Legendas e áudio -->
  <dialog class="sheet" id="optSheet" aria-label="Opções">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 class="opt-h" id="optTitle"></h2>
    <div class="sheet-body" id="optBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
